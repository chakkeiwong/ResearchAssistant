[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "research-assistant"
version = "0.1.0"
description = "Local-first research development assistant for Claude Code"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = []

[project.optional-dependencies]
mcp = ["mcp[cli]"]
dev = [
  "coverage[toml]>=7.6",
  "mypy>=1.14",
  "pytest>=9",
  "ruff>=0.9",
]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
markers = [
  "external_tool: requires installed external parser tools and may be slow",
  "legacy_provider: historical credential/provider contract outside the active release scope",
]

[tool.coverage.run]
branch = true
source = ["research_assistant"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true

[project.scripts]
ra = "research_assistant.cli:main"
ra-mcp = "research_assistant.adapters.mcp_server:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
